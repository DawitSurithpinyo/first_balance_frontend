# Serve ACME challenges + redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name firstbalance.net;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://firstbalance.net$request_uri;
    }
}